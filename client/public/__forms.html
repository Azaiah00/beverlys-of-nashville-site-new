<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>Beverly's of Nashville form definitions</title>
</head>
<body>
  <!-- Static Netlify form definitions for both the editorial pages and React portal. -->
  <form name="hair-consultation" method="POST" data-netlify="true" netlify-honeypot="company" hidden>
    <input type="hidden" name="form-name" value="hair-consultation">
    <input type="hidden" name="subject" value="New Beverly's consultation request">
    <input name="company">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input name="interest">
    <textarea name="message"></textarea>
  </form>

  <form name="appointment-request" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="appointment-request">
    <input type="hidden" name="subject" value="New Beverly's appointment request">
    <input name="bot-field">
    <input name="name">
    <input name="phone" type="tel">
    <input name="email" type="email">
    <input name="service">
    <textarea name="message"></textarea>
  </form>

  <form name="healthy-hair-guide-interest" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="healthy-hair-guide-interest">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
  </form>

  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input name="bot-field">
    <input name="name">
    <input name="email" type="email">
    <input name="phone" type="tel">
    <input name="service">
    <textarea name="message"></textarea>
  </form>

  <form name="free-guide" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="free-guide">
    <input name="bot-field">
    <input name="first_name">
    <input name="email_address" type="email">
    <input name="source">
  </form>
</body>
</html>
