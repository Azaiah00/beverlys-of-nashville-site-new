  <body>
    <!-- Static form so Netlify can detect the "contact" form at build time (SPA companion to the React form on Home). -->
    <form name="contact" method="POST" netlify data-netlify="true" data-netlify-honeypot="bot-field" style="display:none" aria-hidden="true">
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"><option></option></select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <!-- Static form so Netlify detects /free-guide submissions at build time. JS POSTs from the React app at runtime. -->
    <form name="free-guide" netlify hidden>
      <input type="text" name="first_name" />
      <input type="email" name="email_address" />
      <input type="text" name="source" />
    </form>
